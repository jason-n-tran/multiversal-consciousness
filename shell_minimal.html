<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Multiversal Consciousness</title>
    <style>
        :root {
            --bg-color: #050508;
            --accent-color: #4facfe;
            --secondary-color: #00f2fe;
            --glow-color: rgba(79, 172, 254, 0.3);
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 0;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            color: white;
        }

        #canvas {
            border: none;
            background-color: black;
            box-shadow: 0 0 40px var(--glow-color);
            max-width: 100%;
            max-height: 100%;
            display: block;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            outline: none;
        }

        .loading-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: var(--bg-color);
            z-index: 100;
            transition: opacity 0.5s ease-out, visibility 0.5s;
        }

        .loading-container.hidden {
            opacity: 0;
            visibility: hidden;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            border-top-color: var(--accent-color);
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        .loading-text {
            font-size: 14px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #888;
            margin-bottom: 15px;
        }

        .progress-bar {
            width: 250px;
            height: 4px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 2px;
            overflow: hidden;
            position: relative;
        }

        #progress {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--accent-color), var(--secondary-color));
            box-shadow: 0 0 10px var(--accent-color);
            transition: width 0.2s ease;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Fullscreen button or hints could go here if needed */
        .status-overlay {
            position: fixed;
            bottom: 20px;
            left: 20px;
            font-size: 10px;
            color: #333;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="loading-container" id="loading">
        <div class="spinner"></div>
        <div class="loading-text" id="status">Syncing Realities...</div>
        <div class="progress-bar">
            <div id="progress"></div>
        </div>
    </div>

    <!-- The Canvas -->
    <canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>

    <div class="status-overlay" id="status-detailed"></div>

    <script type='text/javascript'>
        var statusElement = document.getElementById('status');
        var progressElement = document.getElementById('progress');
        var loadingContainer = document.getElementById('loading');

        var Module = {
            preRun: [],
            postRun: [],
            print: (function() {
                return function(text) {
                    if (arguments.length > 1) text = Array.prototype.slice.call(arguments).join(' ');
                    console.log(text);
                };
            })(),
            canvas: (function() {
                var canvas = document.getElementById('canvas');
                // As a default behavior, yield if requested
                canvas.addEventListener("webglcontextlost", function(e) { 
                    alert('WebGL context lost. You will need to reload the page.'); 
                    e.preventDefault(); 
                }, false);
                return canvas;
            })(),
            setStatus: function(text) {
                if (!Module.setStatus.last) Module.setStatus.last = { time: Date.now(), text: '' };
                if (text === Module.setStatus.last.text) return;
                
                var m = text.match(/([^(]+)\((\d+(\.\d+)?)\/(\d+)\)/);
                var now = Date.now();
                if (m && now - Module.setStatus.last.time < 30) return; // if this is a progress update, skip it if too soon
                
                Module.setStatus.last.time = now;
                Module.setStatus.last.text = text;
                
                if (m) {
                    text = m[1];
                    progressElement.style.width = (parseInt(m[2]) / parseInt(m[4]) * 100) + '%';
                } else {
                    progressElement.style.width = '100%';
                    if (!text) {
                        loadingContainer.classList.add('hidden');
                    }
                }
                statusElement.innerHTML = text || 'Ready';
            },
            totalDependencies: 0,
            monitorRunDependencies: function(left) {
                this.totalDependencies = Math.max(this.totalDependencies, left);
                Module.setStatus(left ? 'Preparing... (' + (this.totalDependencies-left) + '/' + this.totalDependencies + ')' : 'All downloads complete.');
            }
        };

        Module.setStatus('Downloading...');
        window.onerror = function() {
            Module.setStatus('Exception thrown, see JavaScript console');
            loadingContainer.classList.remove('hidden');
            statusElement.innerHTML = "Reality Collapse Detected.";
            statusElement.style.color = "#ff4b4b";
        };
    </script>
    {{{ SCRIPT }}}
</body>
</html>
